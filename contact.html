<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Portfolio</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1 class="logo">My Portfolio</h1>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-section contact-section">
            <h2>Contact Me</h2>

            <p>
                If you would like to contact me, please use the details below.
            </p>

            <div class="contact-details">
                <p><strong>Email:</strong> nazifa123@example.com</p>
                <p><strong>Phone:</strong> +123 456 7890</p>
                <p><strong>Location:</strong> Guntur, India</p>
            </div>

            <form class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"
                    placeholder="Write your message"></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Nazifa. All rights reserved.</p>
    </footer>

</body>
</html>
